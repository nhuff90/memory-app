# Recall on Fly.io: one small machine that sleeps when idle, with a 1 GB volume for the database and photos.
# Change `app` to a unique name before the first deploy.
app = "mem-recall-app"
primary_region = "iad"
# Time to finish uploading the last changes to the backup bucket before the machine stops.
kill_timeout = 30

[env]
  RECALL_TIMEZONE = "America/New_York"

[mounts]
  source = "recall_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
